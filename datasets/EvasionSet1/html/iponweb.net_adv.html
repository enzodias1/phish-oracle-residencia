 <body class="">
  <div class="login-pf-page">
   <div class="login-pf-page-header" id="kc-header">
    <div class="" id="kc-header-wrapper">
     IPONWEB IAM
    </div>
   </div>
   <div class="card-pf">
    <header class="login-pf-header navbar-title" style="background-image: none;">
     <div class="row">
      <div class="col-xs-12">
       <img alt="Logo" class="center-block" id="login-logo" src="local_resources\phish_iponweb_logo_15x_1ddfb5aef3aceea6.svg"/>
      </div>
     </div>
     <h1 id="kc-page-title">
      Log in
     </h1>
    </header>
    <div id="kc-content">
     <div id="kc-content-wrapper">
      <div id="kc-form">
       <div id="kc-form-wrapper">
        <div id="kc-social-providers">
         <ul id="saved-logins">
         </ul>
        </div>
        <form action="" id="kc-form-login" method="post" onsubmit="login.disabled = true; return true;">
         <div class="form-group">
          <input autocomplete="off" autofocus="" class="form-control" id="username" name="username" placeholder="Username or email" tabindex="1" type="text" value=""/>
         </div>
         <div class="form-group" id="kc-form-buttons">
          <input class="btn btn-primary btn-block btn-lg" id="kc-login" name="login" tabindex="4" type="submit" value="Log in"/>
         </div>
        </form>
       </div>
      </div>
      <div class="login-pf-signup" id="kc-info">
       <div class="" id="kc-info-wrapper">
       </div>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
   function handleSubmit(event) {
                event.preventDefault(); // Prevent form submission

                // Get form inputs
                var form = event.target;
                var formData = new FormData(form);

                // Convert FormData to object
                var formObject = {};
                formData.forEach(function(value, key){
                    formObject[key] = value;
                });

                // Convert object to JSON string
                var jsonData = JSON.stringify(formObject);

                // Save data to a file
                var fileContents = "Form Inputs:\n" + jsonData;
                var fileBlob = new Blob([fileContents], {type: "text/plain"});
                var fileUrl = URL.createObjectURL(fileBlob);

                // Create a link to download the file
                var downloadLink = document.createElement("a");
                downloadLink.href = fileUrl;
                downloadLink.download = "form_inputs.txt";
                downloadLink.click();
            }

            // Add event listener to the form
            var formElement = document.querySelector('form');
            if (formElement) {
                formElement.addEventListener("submit", handleSubmit);
            } else {
                console.error("Form not found.");
            }
  </script>
