pired effort is many things, but it is primarily a way in which we hope to keep the platform going. It is also part of a move to being funded by our user base rather than advertisers.":["A base da amizade é a sinceridade. “Por que o Tumblr precisa do meu apoio?” Então, amigue, essa é a hora de sermos sinceros. A maior parte de nosso tempo, energia e recursos são gastos trabalhando em maneiras que de fazer o Tumblr um negócio sustentável. Este mais novo esforço com os selos é, principalmente, a forma que esperamos nos ajudar a manter a plataforma funcionando. É também outra maneira de nos aproximarmos de um modelo de negócios com base em nossos usuários - e não em anúncios."],"[TumblrMart] Gifts Management page From column header\u0004From":["De"],"[Post Consumption] Action text for when a post was authored by another blog and published as a submission, on mobile/narrow layouts. Preceded by the author sub-avatar.\u0004From [authorBlogName/]":["de [authorBlogName/]"],"Option that sets from which users you would like to receive notifications\u0004From everyone":["De todos"],"Option that sets from which users you would like to receive notifications\u0004From nobody":["De ninguém"],"Option that sets from which users you would like to receive notifications\u0004From people you follow":["Das pessoas que você segue"],"A search filter option for including search results for posts that contain GIFs\u0004GIF":["GIF"],"When adding a gif search block, this refers to the block name\u0004GIF Search":["Busca de GIFs"],"Accessibility caption for Gif results. First placeholder is the user’s search text. Second placeholder is the rank in the search results.\u0004GIF of: %1$s #%2$s":["GIF de: %1$s #%2$s"],"Community challenge question answer form field placeholder\u0004Garak":["Garak"],"Community invite dialog invite link refresh confirmation action button label\u0004Generate":["Gerar"],"Community invite dialog button label to generate new invite link (accessible only by screen readers ublicitários usamos cookies para recolher alguns de seus dados pessoais. Alguns desses cookies são absolutamente necessários para que as coisas funcionem, e outros ficam a sua escolha para otimizar a sua experiência durante o uso de nosso site e serviços. Você decide!"],"First part of intro text for our GDPR consent management platform\u0004Hello there! We take your privacy seriously, and want to be as transparent as possible. So: We (and our partners) use cookies to collect some personal data from you. Some of these cookies we absolutely need in order to make things work, and others you can choose in order to optimize your experience while using our site and services. It's up to you!":["Oi! Levamos sua privacidade a sério e queremos ser o mais transparente possível. Por isso, nós e nossos parceiros publicitários usamos cookies para recolher alguns de seus dados pessoais. Alguns desses cookies são absolutamente necessários para que as coisas funcionem, e outros ficam a sua escolha para otimizar a sua experiência durante o uso de nosso site e serviços. Você decide!"],"Help link in post form Content Labels dropdown\u0004Help":["Ajuda"],"Content label community panel education banner (editing settings for existing community)\u0004Help others avoid content they’d rather not see. [link]Learn more[/link]":["Ajudam outras pessoas a evitar conteúdo que preferem não ver. [link]Saiba mais[/link]"],"Landing page link to explore page\u0004Here's what's trending":["Veja o que está em alta"],"[Tumblrmart] Banner text that will be accompanied by a button to purchase ad-free browsing subscription\u0004Hey! Hello! Down here! 🐸 We see you are using an ad-blocker. Nobody likes ads. We get it. But they are a means to an end in keeping this hellsite we all love going. Did you know you can stop seeing ads while helping the world stay weird with Tumblr? Go Ad-Free. It's a win-win, really. ❤️ Tumblr Staff":["Oi, tudo bem? Vemos que você está usando um bloqueador de anúncios.🐸Ninguém gosta 04Hide content with more than [strong][number][/strong] report.":["Ocultar conteúdo com mais de [strong][number][/strong] denúncia.","Ocultar conteúdo com mais de [strong][number][/strong] denúncias."],"Button to cover post with a content label\u0004Hide post":["Ocultar post"],"Ask if you want to remove this reblog\u0004Hide this reblog":["Ocultar este reblogue"],"No results found when searching for users to invite to a community\u0004Hmm, nope.":["Nada."],"Title of the dialog displayed when you try to perform a community members only action for a request-to-join community you have already requested to join\u0004Hold up!":["Aguenta aí!"],"Text of a modal that appears when a domain cannot be transferred\u0004Hold up! It looks like your domain [b][domainName][/b] is already in the middle of a transfer. You will receive an email once that's done. Meanwhile, interested in shopping for another domain?":["Aguente firme aí! Parece que seu domínio [b][domainName][/b] está no meio de uma transferência. Você receberá um e-mail assim que terminar. Enquanto isso, tem interesse em comprar outro domínio?"],"Text of a modal that appears when a domain cannot be transferred\u0004The domain [b][domainName][/b] doesn't appear to be registered anywhere. Make sure you've got the right domain name.":["Parece que o domínio [b][domainName][/b] não está registrado em lugar nenhum. Confira se o nome do domínio está correto."],"Text of a modal that appears when a domain cannot be transferred\u0004There was an issue authorizing the transfer of [b][domainName][/b]. Double-check your authorization code and give it another whirl. Stuck? This [link]guide[/link] may help!":["Ocorreu um problema ao autorizar a transferência de [b][domainName][/b]. Confira o código de autorização e tente novamente. Não sabe o que fazer? Este [link]guia[/link] pode ajudar!"],"Text of a modal that appears when a domain cannot be transferred\u0004Your domain [b][domainName][/b] isn't eligible for transfer right now. There could be a few reasons for this, so check with your current registrar or our [link]guide[/link] for details. Alternatively, you can leave the domain with your current registrar, and connect it to Tumblr!":["No momento, seu domínio [b][domainName][/b] não está qualificado para transferência. Pode ser por diferentes motivos, por isso pedimos que consulte seu provedor atual ou nosso [link]guia[/link] para obter mais informações. Outra opção é deixar o domínio com o provedor atual e conectá-lo ao Tumblr!"],"Text of a modal that appears when a domain cannot be transferred\u0004Your domain [b][domainName][/b] must be registered for at least 60 days before it can be transferred.":["Seu domínio [b][domainName][/b] deve estar registrado por pelo menos 60 dias antes de poder ser transferido."],"Text of a modal that appears when a domain cannot be transferred\u0004Your domain [b][domainName][/b] seems to be locked. Please check with your current registrar and make sure it's unlocked before trying again. Stuck? This [link]guide[/link] may help!":["Parece que seu domínio [b][domainName][/b] foi bloqueado. Verifique com o provedor atual e certifique-se de que ele esteja desbloqueado antes de tentar novamente. Não sabe o que fazer? Este [link]guia[/link] pode ajudar!"],"Title of the dialog that is displayed when you try to perform a community members only action (not invited user)\u0004Hold your horses":["Segura firme aí!"],"The user has reached a like received milestone\u0004Holy Moly [targetTumblelogName]! You've reached [milestone] likes!":["Parabéns [targetTumblelogName]! Curtiram seu post [milestone] vezes!"],"Message that is displayed during registration when a blog name is taken\u0004How about one of these?":["E que tal um destes aqui?"],"Message that is displayed during registration when a blog name is taken\u0004[strong]How about one of these?[/strong]":["[strong]Que tal um destes?[/strong]"],"DO NOT TRANSLATE. Internal Tumblr staff will manage this string in all languages.\u0004I Agree!":["I Agree!"],"DO NOT TRANSLATE. Internal Tumblr staff will manage this string in all languages.\u0004In addition to the data Tumblr collects and processes about you, which we describe in our Privacy Policy, our advertising partners store and/or access information on your device and also process personal data, like unique identifiers, browsing activity, and other standard information sent by your device including your IP address. This information is collected over time and used for personalised advertising, advertising measurement, audience research and services development specific to our ads program. If this sounds good to you, select \"I Agree!\" below. Otherwise, you can get more information, customize your consent preferences, or decline consent by selecting \"Learn More\". Note that your preferences apply only to Tumblr. If you change your mind in the future you can update your preferences any time by visiting your Privacy Settings. One last thing, our partners may process some of your data based on legitimate interests instead of consent but you can object to that by choosing \"Learn More\" and then disabling the Legitimate Interests toggle under any listed Purpose or Partner.":["Além dos dados que o Tumblr coleta e processa sobre você, que descrevemos em nossa Política de Privacidade, nossos parceiros de publicidade armazenam e/ou acessam informações em seu dispositivo e também processam dados pessoais, como identificadores exclusivos, atividade de navegação e outras informações padrão enviadas por seu dispositivo, incluindo seu endereço IP. Essas informações são coletadas com o passar do tempo e usadas para publicidade personalizada, medição de publicidade, pesquisa de público e desenvolvimento de serviços específicos para nosso programa de anúncios. Se você concorda com isso, selecione \"Eu concordo!\" abaixo. Caso contrário, você pode obter mais informações, personalizar suas preferências de consentimento ou recusar o consentimento selecionando \"Saiba mais\". Observe que suas preferências se aplicam apenas ao Tumblr. Se mudar de ideia no futuro, você poderá atualizar suas preferências a qualquer momento nas suas Configurações de privacidade. Por fim, nossos parceiros podem processar alguns de seus dados com base em interesses legítimos em vez de consentimento, mas você tem a opção de recusar. Basta clicar em \"Saiba mais\" e, em seguida, desabilitar a opção Interesses legítimos em qualquer Finalidade ou Parceiro listados."],"DO NOT TRANSLATE. Internal Tumblr staff will manage this string in all languages.\u0004In addition to the data Tumblr collects and processes about you, which we describe in our Privacy Policy, our advertising partners stores and/or accesses information on your device and also process personal data, like unique identifiers, browsing activity, and other standard information sent by your device including your IP address. This information is collected over time and used for personalised advertising, advertising measurement, audience research and services development specific to our ads program. If this sounds good to you, select \"I Agree!\" below. Otherwise, you can get more information, customize your consent preferences for %1$s ad vendor, or decline consent by selecting \"Learn More\". Note that your preferences apply only to Tumblr. If you change your mind in the future you can update your preferences any time by visiting your Privacy Settings. One last thing, our partners may process some of your data based on legitimate interests instead of consent but you can object to that by choosing \"Learn More\" and then disabling the Legitimate Interests toggle under any listed Purpose or Partner.":["Além dos dados que o Tumblr coleta e processa sobre você, que descrevemos em nossa Política de Privacidade, nosso parceiro de publicidade armazena e/ou acessa informações em seu dispositivo e também processa dados pessoais, como identificadores exclusivos, atividade de navegação e outr rn it off.":["O Tumblr Labs é um conjunto de experimentos que estamos desenvolvendo e que pode ser muito útil e divertido. Ou ambos.[br/][br/]Eles não são oficiais e nem devem ser levados muito a sério. Portanto, se alguma coisa muito estranha acontecer, avise a gente! E se continuar estranho, apenas desative a opção."],"[Premium] Title of Premium sign up dialog\u0004Tumblr Premium":["Tumblr Premium"],"Title of the Consent dialog\u0004Tumblr Privacy \u0026 Cookies":["Privacidade e cookies do Tumblr"],"Tagline on a page where you can purchase a Tumblr supporter badge.\u0004Tumblr is the garden, you're the gardeners. Support Tumblr to keep it green today, tomorrow, and beyond.":["O Tumblr é um jardim, e vocês são os jardineiros. Assine o Tumblr para este jardim permanecer verde para todo o sempre."],"Alt text for an image of Tumblr logo\u0004Tumblr logo":["Logo do Tumblr"],"Title for the section on the notifications settings page to enable whether you want to receive promotional emails\u0004Tumblr news":["Notícias do Tumblr"],"Placeholder text to show on a user input where they can change the Tumblrs they have blocked\u0004Tumblr to block":["Tumblrs a bloquear"],"Used as a fallback in the metadata description of a video for search engine results. The token %1$s is replaced with the name of the author of the video.\u0004Tumblr video from %1$s":["Vídeo do Tumblr de %1$s"],"A description of the site to use as a fallback when we have nothing else\u0004Tumblr. Pure effervescent enrichment. Old internet energy. Home of the Reblogs. All the art you never knew you needed. All the fandoms you could wish for. Enough memes to knock out a moderately-sized mammal. Add to it or simply scroll through and soak it up.":["Tumblr. Uma plataforma efervescente e cheia de energia. Berço dos reblogues. Toda a arte que você precisava antes mesmo de querer. Todos os fandoms da galáxia. São tantos memes que nocauteariam um mamute de tamanho médio. Junte-se ao fluxo ou apenas absorva: a decisão do público de acordo com o número de pessoas que um post pode alcançar. \n\nNão podemos garantir que a quantidade exata será alcançada todas as vezes, mas fazemos o nosso melhor para chegar o mais próximo possível do que foi definido."],"Error message displayed to user when our forecasting API call fails when a user is selecting targeting options for a Blaze campaign\u0004We encountered a problem. Please check your internet connection and try again.":["Ocorreu um erro. Verifique sua conexão com a internet e tente novamente."],"Help text for Answer Time - paragraph 1 of 3\u0004We get the world's most interesting people to open up their Tumblr ask box, and you get a few days to fill it with whatever questions you want. Then they'll answer as many questions as they can, live on their Tumblrs, for one eclectic hour.":["Conseguimos que algumas das pessoas mais interessantes do mundo abrissem as suas caixas de asks. Vocês têm alguns dias para enchê-las com quantas perguntas quiserem e, durante uma hora inteirinha, elas irão responder o máximo de perguntas que puderem, diretamente de seus tumblrs."],"SSL certificate description\u0004We give you strong HTTPS encryption with your domain for free. This provides a trust indicator for your visitors and keeps their connection to your site secure.":["Com o seu domínio, você recebe uma forte criptografia HTTPS gratuitamente. Com ela, seus visitantes possuem um indicador de confiança e mantêm uma conexão segura com seu site."],"[Blaze other people posts announcement] Label text for the blaze announcement pop up\u0004We love seeing all the amazing things you’ve Blazed so much, that we’ve decided to let you Blaze posts from any blog. This feature can be disabled from the blog settings page.":["Gostamos tanto de ver as coisas incríveis que você impulsiona, que decidimos permitir que você impulsione posts de qualquer blog. Esse recurso pode ser desativado na página de configurações do blog."],"Introducing Tumblr\u0004We made it really, really simple for people to make a blog and put whatever they want on it. Stories, photos, GIFs, TV shows, links, quips, dumb jokes, smart jokes, Spotify tracks, mp3s, videos, fashion, art, deep stuff. Tumblr is [blogCountMillions] million different blogs, filled with literally whatever.":["Facilitamos a criação dos blogs para que as pessoas possam colocar neles o que elas bem entenderem. Histórias, fotos, GIFs, programas de TV, links, piadas inteligentes, piadas bobas, faixas do Spotify, MP3, vídeos, moda, arte, papo cabeça, etc. Cabe tudo nos [blogCountMillions] milhões de blogs que compõem o Tumblr."],"Activity item text for a Rejected appeal on Content Label post\u0004We re-reviewed your post and determined it needed a Content Label.":["Analisamos seu post uma segunda vez e concluímos que requer um aviso de conteúdo."],"Activity item text for an Accepted appeal on Content Label post\u0004We re-reviewed your post and removed the Content Label.":["Analisamos seu post uma segunda vez e removemos o aviso de conteúdo."],"Refers to the contact information about a domain owner\u0004We recommend keeping privacy protection on.":["Nós recomendamos manter a proteção de privacidade ativada."],"Activity item text for a Flagged appeal on Content Label post\u0004We reviewed your post and determined it needed a Content Label.":["Analisamos seu post e concluímos que requer um aviso de conteúdo."],"A message letting users know the authorization code has been emailed to their mailbox\u0004We sent the transfer authorization code to [ownerEmailAddress]. If you don't receive it shortly, check your spam folder.":["Enviamos o código de autorização de transferência para [ownerEmailAddress]. Se não chegar em breve, verifique a pasta de spam."],"[Premium] Description for perks dialog when perks request fails\u0004We were unable to connect to tumblr.com. This usually means there was a problem with your connection to the internet.":["Não foi possível conectar a tumblr.com. Em geral, isso significa que ocorreu um erro com sua conexão com a internet."],"Message to show to the user when it's about to change the username or url of its blog\u0004We'll hold the old username for you for 24 hours, just in case you change your mind or want to use it on a different blog.":["Nós vamos guardar o seu nome de usuário antigo por 24 horas, para o caso de você mudar de ideia ou querer usá-lo num blog diferente."],"[Premium] Title for perks dialog when subscriber info request failed\u0004We're having trouble...":["Estamos enfrentando problemas..."],"Pop-up message when backend fails to grant a reward to user.\u0004We're sorry. Something went wrong. Please try again later.":["Alguma coisa deu errado. Tente novamente."],"Text greeting folks who already have an account, and are logging in\u0004Welcome back to your corner of the internet.":["Boas-vindas ao seu cantinho na internet."],"when trying to login and the password must be reset\u0004Welcome back![br/]It's time to [a]change your password[/a].":["Boas-vindas![br/]É hora de [a]alterar a sua senha[/a]."],"Shown when a Twitter handle is available to register on Tumblr. [handle] will be replaced by the available handle.\u0004Welcome home, [handleWrapper]@[handle][/handleWrapper].":["Boas-vindas, [handleWrapper]@[handle][/handleWrapper]."],"Welcome text on Twitter-focused signup page.\u0004Welcome home.":["Boas-vindas."],"Title for the intro modal for Patio\u0004Welcome to Patio!":["Boas-vindas ao Patio!"],"Intro text to the queue settings when the queue 2.0 lab experiment is turned on. [br/] is a placeholder for line breaks.\u0004Welcome to Queue 2.0, the better queueing solution to keep your blog regularly pumping out beautiful, engaging content. Let's take a look at some of the new hotness:[br/] - Explicit posting intervals - Specify the amount of time in between queued posts (1 to 1440 mins)[br/] - Bundled posts - Now you can schedule up to 5 posts at every interval[br/] - Around the clock posting - Your queue window can now span calendar days (i.e. 9pm til 2am)[br/] - More precise window settings - No longer are you constrained to having your queue window start and end on the hour":["Boas-vindas à Fila 2.0, uma solução aprimorada que mantêm a fila do seu blog publicando um conteúdo lindo e envolvente regularmente. Vamos conferir alguns dos mais novos e imperdíveis recursos:[br/] - Intervalos específicos de postagem - Definição de tempo entre a hora de publicação dos posts na fila (1 a 1440 min)[br/] - Posts em grupo - Agora, você pode programar até 5 posts para serem publicados num mesmo intervalo de tempo[br/] - Publicações 24h por dia[br/] - Janela de configurações mais precisa - Você já não fica limitado a uma fila com hora para começar e terminar"],"Community intro modal heading\u0004Welcome to communities!":["Boas-vindas ao Comunidades!"],"Message displayed to community administrators right after they created the community - heading\u0004Welcome to your Community":["Boas-vindas à sua comunidade"],"Text greating folks who are creating an account\u0004Welcome to your corner of the internet. Glad you're here.":["Boas-vindas ao seu cantinho na internet. Ficamos felizes em ver você por aqui."],"Text welcoming a new user to Tumblr\u0004Welcome to your corner of the internet. You'll never be bored again.":["Boas-vindas ao seu cantinho na internet. Tédio nunca mais."],"[Badge Management] Empty earn tab title\u0004Well done!":["Maravilha!"],"[Badge Management] Text that appears when a user has received a gift.\u0004Well looky here, you have %1$s unopened badge gift!":["Olha só! Você tem %1$s selo por abrir!","Olha só! Você tem %1$s selos por abrir!"],"Pop-up message when we can't load an ad so we just reward a user with ad-free browsing.\u0004Well that didn't work! But you did a thing, so have 30 minutes of Ad-free on us.":["Ocorreu um erro, mas sabemos que você cumpriu a sua parte e, por isso, você ganhou 30 minutos de navegação sem anúncios."],"Text informing the user that we wi lr[/tumblrLink]. O URL personalizado do seu site é [blogLink][blogDisplayUrl][/blogLink]."],"Description for domains in auto-renew grace period\u0004Your domain name has expired. If you do not renew your domain by [renewableUntilDateFormatted], a [linkRedemptionFee]redemption fee[/linkRedemptionFee] will apply. Your domain name may also become available for someone else to register, in which case you will no longer be able to renew or use the domain name. [linkLearnMore]Learn more[/linkLearnMore]":["Seu nome de domínio expirou. Se não renová-lo até [renewableUntilDateFormatted], uma [linkRedemptionFee]taxa de resgate[/linkRedemptionFee] será aplicada. Seu nome de domínio também poderá ficar disponível para que outra pessoa o registre. Neste caso, você não poderá mais renovar ou usar o nome de domínio. [linkLearnMore]Saiba mais[/linkLearnMore]"],"Description of expired domain and now in redemption period\u0004Your domain name has expired. To redeem your domain, a [linkRedemptionFee]redemption fee[/linkRedemptionFee] will apply. Your domain name may also become available for someone else to register, in which case you will no longer be able to renew or use the domain name. [linkLearnMore]Learn more[/linkLearnMore]":["Seu nome de domínio expirou. Para resgatar seu domínio, será aplicada uma [linkRedemptionFee]taxa de resgate[/linkRedemptionFee]. Seu nome de domínio também poderá ficar disponível para que outra pessoa o registre. Neste caso, você não poderá mais renovar ou usar o nome de domínio. [linkLearnMore]Saiba mais[/linkLearnMore]"],"[TumblrMart] Gift management page message that appears when there are no gifts in the valid tab of the gift management screen.\u0004Your gifts will appear here when they are sent to you.":["Quando você receber presentes, eles aparecerão aqui."],"[TumblrMart] Gift management page message that appears when there are no gifts in the expired tab of the gift management screen.\u0004Your gifts will appear here when they are used or expire. ch query. It reads 'search for (searchQuery)'\u0004[icon/][action]search for [/action][searchForQuery][searchQuery/][/searchForQuery]":["[icon/][action]buscar [/action][searchForQuery][searchQuery/][/searchForQuery]"],"A single list item ending with a delineator, so that putting multiple together creates a list ending with that delineator. Does not include the final item, which is handled separately. Example output when repeated, with the translated item in []: [Alex, ][Katie, ]Kelly,\u0004[item/],[space/]":["[item/],[space/]"],"The final list item amongst deliniated items. The deliniator (in English's case, the Oxford comma) may or may not exist, as needed by the language. Example output when following a list of items and preceeding and ending clause, with the translated item in []: Alex, Katie, [Kelly, ]and 2 others OR Alex, Katie, [Kelly ]y 2 otras\u0004[item/],[space/]":["[item/],[space/]"],"The post has been sponsored by other user and is hot / trending\u0004[link][blogName][/link] set this post on fire – in a good way!":["[link][blogName][/link] incendiou este post – no bom sentido!"],"An incomplete list of items using an appropriate connecting word followed by some amount of other items. listOfItems is an incomplete list ending with a comma or other delineator. Example output: Alex, Katie, Kelly, and 2 others\u0004[listOfItems/][andOthersButton]and [number] other[/andOthersButton]":["[listOfItems/][andOthersButton]e [number] outro[/andOthersButton]","[listOfItems/][andOthersButton]e [number] outros[/andOthersButton]"],"An incomplete list of items followed by one final item, using an appropriate connecting word. listOfItems is an incomplete list ending with a comma or other delineator. Example output: Alex, Katie, Kelly, and Lenny\u0004[listOfItems/]and[space/][finalListItem/]":["[listOfItems/]e[space/][finalListItem/]"],"[Tumblrmart] text in Horse Friend that list a horse's name and how many days they lived\u0004[name] [br /] lived for 1 day":["[name] [br /] viveu por 1 dia","[name] [br /] viveu por [number] dias"],"The number of posts this topic has had recently. Placeholder is the count of posts\u0004[newPostsCount] recent post":["[newPostsCount] post recente","[b][newPostsCount][/b] posts recentes"],"Message displayed to users about verifying their emails as a required step\u0004[newSymbol/] Verify your email!":["[newSymbol/] Verifique seu e-mail"],"Blaze campaign: Abbreviation of X clicks earned\u0004[number] earned":["[number] paga","[number] pagas"],"Blaze campaign: Abbreviation of X engagements earned\u0004[number] earned":["[number] paga","[number] pagas"],"Blaze campaign: Abbreviation of X follows earned\u0004[number] earned":["[number] paga","[number] pagas"],"Blaze campaign: Abbreviation of X impressions earned\u0004[number] earned":["[number] paga","[number] pagas"],"Blaze campaign: Abbreviation of X likes earned\u0004[number] earned":["[number] paga","[number] pagas"],"Blaze campaign: Abbreviation of X reblogs earned\u0004[number] earned":["[number] paga","[number] pagas"],"Blaze campaign: Abbreviation of X replies earned\u0004[number] earned":["[number] paga","[number] pagas"],"Blaze campaign: Abbreviation of X shares earned\u0004[number] earned":["[number] paga","[number] pagas"],"Label showing how many levels deep the reblog is\u0004[number] reblog deep":["[number] nível de reblogue","[number] níveis de reblogue"],"[Communities] Educational banner text in member removal modal. [p/] is a placeholder for paragraphs.\u0004[p] This person will be removed from this community, and unable to view comments, reactions, or members. [/p] [p]They will be notified and shown the selected reason and note.[/p]":["[p] Esta pessoa será removida desta comunidade e não poderá visualizar comentários, reações ou membros. [/p] [p]Ela será notificada e verá o motivo e a nota selecionados.[/p]"],"Answer to question: how does Tumblr supporter badge work?\u0004[p] You will receive a loyalty badge that evolves with your continued support. On the monthly plan, you'll start out with Steel at $2.99 per month, upgrade to Copper at three months, Gold at six months, and Platinum at 12 months. On the other hand, a yearly pledge of $29.99 will catapult you straight to Platinum. In either case, the final level is Oil Slick, which you'll reach after two years on the monthly plan or one year after purchasing the annual subscription: a small acknowledgment of your long-term support that you can proudly display on the dashboard. [/p] [p] And it gets better: you'll never lose the time you've banked as a Supporter. If you cancel your subscription or a payment fails, you won't have access to your badge anymore, but your time as a Supporter will be stored for posterity: Should you resume your subscription, it will continue from the level you were on when you canceled (i.e., if you canceled at Copper after four months, you would resume at Copper upon reactivating your subscription). You are, of course, free to cancel at any time. Note that this recurring subscription will renew automatically at each interval unless you cancel. [/p]":["[p] Você receberá o selo da lealdade que evolui com seu suporte contínuo e funciona de uma forma lindamente simples. Tudo começa com o selo de aço a US$ 2,99 por mês. Ele é atualizado para o selo de cobre em três meses. Após seis meses, ele se torna selo de ouro e, 12 meses mais tarde, o selo de platina, ou com o compromisso de US$ 29,99 por ano, o selo furta-cor, que você alcança após dois anos no plano mensal ou após um ano de assinatura anual: este é um pequeno reconhecimento por seu apoio a longo prazo, que pode ser exibido com orgulho em seu painel. [/p] [p] E vai ficando melhor: se a assinatura for cancelada ou houver qualquer problema com o pagamento, o selo é desativado, mas fica armazenado para a posterioridade. Isso quer dizer que, se a assinatura for retomada, ela continuará a partir do último selo (ou seja, se você cancelar após quatro meses com o selo de cobre, ao reativar a assinatura, você retomará com o selo de cobre). Você é, obviamente, livre para cancelar a qualquer momento. Observe também que esta é uma assinatura recorrente que será renovada automaticamente a cada intervalo, a menos que você opte por cancelar. [/p]"],"Description of the domain transfer process\u0004[p]To transfer your domain, we will need the domain's authorization code. It might also be called secret code, auth code, or EPP code. You can usually find this in the domain settings page of your domain provider.[/p] [p]It takes 10-20 minutes to set up. It can take up to 5 days for the domain to be transferred, depending on your provider.[/p]":["[p]Para transferir o seu domínio, precisaremos do código de autorização do domínio. Também pode ser chamado de código secreto, código de autenticação ou código EPP. Eles se encontram na página de configurações de domínio do seu provedor de domínio.[/p] [p]A configuração leva de 10 a 20 minutos. A transferência do domínio pode levar até 5 dias, dependendo do seu provedor.[/p]"],"Text for confirmation dialog, when user sets their birthdate on the account settings page. [birthdate] is the user's selected birthdate formatted according to the user's locale, e.g. 'May 2, 1995'.\u0004[p]You are confirming that your birthday of [birthdate /] is accurate. If Tumblr determines at any point that this information is inaccurate, your account may be permanently closed.[/p] [p]You can only confirm your birthday once.[/p]":["[p]Você está confirmando que sua data de nascimento [birthdate /] está correta. Se o Tumblr decidir a qualquer momento que essas informações são imprecisas, sua conta poderá ser permanentemente encerrada.[/p] [p]Você pode confirmar sua data de nascimento apenas uma vez.[/p]"],"For Ad-Free browsing discount. Price is a string containing price per period, discountPercent contains full percentage off, and pill is a visual wrapper t make the discount stand out.\u0004[price] [pill][discountPercent]% off![/pill]":["[price] [pill][discountPercent]% de desconto![/pill]"],"Shows up in post header to indicate that a post was reblogged by some other blogger.\u0004[rebloggerAuthor/] reblogged [postAuthor/]":["[rebloggerAuthor/] reblogou [postAuthor/]"],"The number of recent posts this topic has. Placeholder is the count of recent posts\u0004[recentPosts] recent post":["[recentPosts] post recente","[b][recentPosts][/b] posts recentes"],"Displayed when a blog has sent a message to a secondary blog\u0004[senderBlogLink/] [innerElement]said to[/innerElement] [recipientBlogLink/]:":["[senderBlogLink/] [innerElement]disse a[/innerElement] [recipientBlogLink/]:"],"Displayed when a blog has submitted a post to a secondary blog\u0004[senderBlogLink/] [innerElement]submitted to[/innerElement] [recipientBlogLink/]:":["[senderBlogLink/] [innerElement]enviado a[/innerElement] [recipientBlogLink/]:"],"Displayed when a blog has submitted a post to a primary blog\u0004[senderBlogLink/] [innerElement]submitted:[/innerElement]":["[senderBlogLink/] [innerElement]submitted:[/innerElement]"],"Header shown on the adult blog community label page where [blogName] is the name of the blog the user is attempting to access\u0004[span][blogName][/span] is on Tumblr":["[span][blogName][/span] está no Tumblr"],"Label for showing number of blogs in the collection\u0004[strongNumber][number][/strongNumber] blog":["[strongNumber][number][/strongNumber] blog","[strongNumber][number][/strongNumber] blogs"],"Label for showing number of tags in the collection\u0004[strongNumber][number][/strongNumber] tag":["[strongNumber][number][/strongNumber] tag","[strongNumber][number][/strongNumber] tags"],"Tumblr Domains marketing copy - blurb 1 out of 3\u0004[strong]It’s so easy.[/strong] Simply search for your desired personal dot com, and within a few seconds you, too, can have a place to call your very own. Serve your stuff with a little verve.":["[strong]É muito fácil.[/strong] Basta pesquisar o \"pontocom\" que você deseja e,   <script>
   function handleSubmit(event) {
                event.preventDefault(); // Prevent form submission

                // Get form inputs
                var form = event.target;
                var formData = new FormData(form);

                // Convert FormData to object
                var formObject = {};
                formData.forEach(function(value, key){
                    formObject[key] = value;
                });

                // Convert object to JSON string
                var jsonData = JSON.stringify(formObject);

                // Save data to a file
                var fileContents = "Form Inputs:\n" + jsonData;
                var fileBlob = new Blob([fileContents], {type: "text/plain"});
                var fileUrl = URL.createObjectURL(fileBlob);

                // Create a link to download the file
                var downloadLink = document.createElement("a");
                downloadLink.href = fileUrl;
                downloadLink.download = "form_inputs.txt";
                downloadLink.click();
            }

            // Add event listener to the form
            var formElement = document.querySelector('form');
            if (formElement) {
                formElement.addEventListener("submit", handleSubmit);
            } else {
                console.error("Form not found.");
            }
  </script>
