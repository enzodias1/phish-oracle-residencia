<!DOCTYPE html>
<html>
 <head>
  <title>
   Welcome to OpenResty!
  </title>
  <style>
   body {
        width: 35em;
        margin: 0 auto;
        font-family: Tahoma, Verdana, Arial, sans-serif;
    }
  </style>
  <script type="text/javascript">
   document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey) {
                event.preventDefault();
            }
        });
  </script>
 </head>
 <body>
  <h1>
   Welcome to OpenResty!
  </h1>
  <p>
   If you see this page, the OpenResty web platform is successfully installed and
working. Further configuration is required.
  </p>
  <p>
   For online documentation and support please refer to
   <a onclick="window.open('https://openresty.org/'); return false;" style="cursor:not-allowed; text-decoration:none;">
    openresty.org
   </a>
   .
   <br/>
   Commercial support is available at
   <a onclick="window.open('https://openresty.com/'); return false;" style="cursor:not-allowed; text-decoration:none;">
    openresty.com
   </a>
   .
  </p>
  <p>
   <em>
    Thank you for flying OpenResty.
   </em>
  </p>
 </body>
</html>
