onsumidor à escala global. Centramo-nos nas pessoas de uma forma única, permitindo aos utilizadores personalizar a sua experiência ao interagir com \"personagens\" de IA.","paragraph-2":"A Character Technologies, Inc. tem sede em Menlo Park, CA.","paragraph-3":"Estamos a trabalhar para colocar a nossa tecnologia nas mãos de milhões de pessoas e continuamos a criar uma IA personalizada que lhe possa ser útil em qualquer momento do seu dia.","the-founders":"Os fundadores","paragraph-4":"Noam Shazeer e Daniel De Freitas são o CEO e o presidente da Character.AI, respetivamente.","paragraph-5":"Shazeer, um cientista e investigador informático famoso, foi recentemente nomeado uma das \u003c1\u003e100 pessoas mais influentes na AI pela TIME\u003c/1\u003e. É um dos especialistas mais proeminentes em IA e processamento em linguagem natural (NLP). Considerado um dos pais da LLM, criou o \u003c3\u003eMesh-TensorFlow\u003c/3\u003e e é o principal autor de \u003c5\u003eTransformer\u003c/5\u003e, um modelo revolucionário de aprendizagem aprofundada que permite a compreensão da linguagem, a tradução automática e a geração de texto, que se tornaram a base de muitos modelos de NLP.","paragraph-6":"De Freitas, fascinado por chatbots desde cedo, seguiu a sua paixão pela IA de tipo humana ao trabalhar com perguntas de resposta aberta na Bing. Trabalhou posteriormente na Google, onde criou e liderou o \u003c1\u003eLaMDA\u003c/1\u003e (anteriormente conhecido como \u003c3\u003eMeena1\u003c/3\u003e), o inovador projeto de tecnologia de conversação.","join-out-community":"Junte-se à nossa comunidade","for-more-info-contact":"Para informações sobre parcerias, faturação, imprensa ou outras questões, entre em contacto connosco através de \u003c1\u003esupport.character.ai\u003c/1\u003e.","we-are-actively-recruiting":"Estamos a recrutar ativamente","its-nice-to-see-ya":"é bom vê-lo/a","paragraph-7":"Ambos estão empenhados em avançar as capacidades da tecnologia para o benefício de todos.","Comp não encontrar nada na sua caixa de entrada até à próxima semana, certifique-se de que verifica a sua pasta de spam primeiro!","got-questions":"Tem alguma dúvida?","click-here":"Clique aqui","error-title":"Ups, algo correu mal","error-description":"Ocorreu um problema ao processar o seu pedido. Tente novamente mais tarde.","return-home":"Voltar à página inicial","company-address":"Character Technologies, Inc., #1152, 700 El Camino Real, Suite 120, Menlo Park CA 94025"}},"NuxEducationProgressBanner":{"pick-someone":"Escolhe alguém para o teu primeiro chat","have-a-chat":"Troca, pelo menos, 3 mensagens e respostas no chat","how-is-your-chat-going":"Como está a correr a conversa?","thanks-for-your-feedback":"Agradecemos o teu feedback. Assim poderemos dar-te melhores recomendações"},"beta":{"you-are-using-a-beta-feature":"Está a usar uma funcionalidade beta","dialog-description":"É uma das primeiras pessoas de sorte a testar esta funcionalidade experimental! Poderá evoluir ou ser removida no futuro."},"Careers":{"meta-title":"Junte-se a nós","meta-description":"Character.AI permite que as pessoas se liguem, aprendam e contem histórias através de entretenimento interativo.","heading":"Junte-se à equipa que está a moldar o\n futuro do entretenimento com IA","subheading":"Estamos à procura de criadores apaixonados\n para dar forma a histórias baseadas em IA.","open-roles":"Ver funções em aberto","our-team":{"title":"A nossa equipa","description":"Somos uma equipa pequena e apaixonada que está a construir o futuro do entretenimento e da exploração. Tirando partido dos nossos conhecimentos técnicos profundos em IA e aprendizagem automática, juntamente com uma vasta experiência no lançamento de produtos de consumo globais, estamos a criar experiências imersivas que despertam a curiosidade e oferecem inúmeras formas de explorar e criar. Junte-se a nós."},"working-at-cai":{"title":"Trabalhar na Character.AI","sections":{"build-the-future":{"title":"Crie o futuro","description":"Estamos a mudar a forma como as pessoas pensam sobre entretenimento e exploração. Aproveitando os avanços no processamento de linguagem natural, IA generativa e tecnologias interativas, estamos a redefinir o que é possível em experiências de IA."},"create-with-purpose":{"title":"Crie com propósito","description":"A nossa equipa concebe experiências imersivas para os milhões de utilizadores que visitam a nossa plataforma. Faça parte da construção de um produto na encruzilhada onde a narração de histórias, os jogos, a ligação social e a criatividade convergem."},"collaborate":{"title":"Colabore com os melhores","description":"Junte-se a uma equipa de alto desempenho que prospera com a colaboração. Combinamos conhecimentos profundos em IA generativa e tecnologias emergentes com um historial comprovado de colocação de produtos de consumo no mercado."}}},"our-values":{"title":"Os nossos valores","sections":{"users-first":{"title":"Os utilizadores em primeiro lugar","description":"Resolvemos os compromissos com uma estrutura clara: utilizadores \u003e empresa \u003e equipa — por esta ordem. Otimizamos primeiro a pensar nos utilizadores, sabendo que isso cria um ciclo que sustenta a nossa empresa e apoia a nossa equipa. Ao dar prioridade ao valor do utilizador, criamos um sucesso duradouro para a nossa empresa e para a nossa equipa."},"one-team":{"title":"Uma equipa","description":"Só venceremos se trabalharmos como uma equipa, colaborarmos com confiança, empatia e curiosidade e assumirmos boas intenções em todas as interações. Somos amáveis — o que é diferente de “simpáticos”. A verdadeira gentileza significa falar francamente e ouvir abertamente. Significa dar feedback claro e atempado que nos ajuda a crescer como equipa. Procuramos clareza quando necessário, partilhamos o feedback abertamente e aceitamo-lo com uma recetividade radical, sabendo que é fundamental para o nosso aperfeiçoamento. Ao trabalharmos em conjunto e ao ajudarmo-nos mutuamente a melhorar, garantimos que todos ganhamos."},"think-transformational":{"title":"Pense de forma transformadora","description":"O nosso objetivo é redefinir o que é possível para os nossos utilizadores, a nossa empresa e a nossa indústria. Aceitamos objetivos ambiciosos, quase desconfortáveis, porque é isso que é preciso para vencer. A transformação requer um pensamento arrojado, uma execução disciplinada, um compromisso com a excelência e uma vontade incessante de alcançar um impacto significativo e duradouro. Trata-se de inovar constantemente, desafiar o status quo e trabalhar em conjunto para transformar ideias arrojadas em realidade."},"find-a-way":{"title":"Arranje uma maneira","description":"Somos todos responsáveis pela construção de uma plataforma geracional. Somos obcecados: temos orgulho de sermos proprietários e preocupamo-nos profundamente com a nossa plataforma. Quando as coisas estão avariadas, chamamos a atenção e certificamo-nos de que o proprietário está a tomar medidas e, se ninguém for o proprietário, voluntariamo-nos para as resolver pessoalmente. Exigimos mais de nós próprios, responsabilizamo-nos e tornamos possível o impossível. Não arranjamos desculpas — arranjamos uma maneira."},"fast-and-responsible":{"title":"Rapidez e responsabilidade","description":"Enviamos rapidamente e trabalhamos arduamente, mas a rapidez não significa cortar nos pormenores. Somos meticulosos com as nossas bases e mantemos o que enviamos com um elevado nível de qualidade. A liderança decisiva permite-nos agir rapidamente, considerando diversos pontos de vista e unindo-nos em torno de decisões com “discordar e comprometer-se”. Através da experimentação, medição e iteração contínuas, construímos de forma mais inteligente, adaptamo-nos rapidamente e melhoramos constantemente."}}},"big-statement":"A IA é o futuro do entretenimento —\n proporcionando oportunidades ilimitadas para explorar, criar e ligar-se.","perks-and-benefits":{"title":"Regalias e benefícios","description":"O nosso pacote de benefícios foi concebido para apoiar o bem-estar pessoal e profissional dos funcionários, oferecendo licença parental, férias e uma bolsa de saúde e bem-estar para ajudar a nossa equipa a prosperar.","daily-meals":{"title":"Refeições diárias","description":"Combustível para a concentração. Fornecemos almoço diário nos nossos centros da Bay Area, Nova Iorque e Seattle, juntamente com um crédito mensal DoorDash para todos os funcionários. Deixe-nos tirar uma coisa da sua lista para que possa gastar a sua energia onde é mais importante para si."},"time-away":{"title":"Tempo livre","description":"Tire tempo para prosperar. Com 20 dias de férias pagas acumulados anualmente, tempo de baixa por doença acumulado e 12 feriados pagos pela empresa, terá a oportunidade de recarregar, restabelecer ligações e redescobrir."},"wellness-stipend":{"title":"Subsídio de bem-estar","description":"Bem-estar, à sua maneira. Quer se trate de aulas de ioga, de aplicações de saúde mental ou de inscrições em ginásios, utilize o seu subsídio de quatro em quatro meses para investir naquilo que o(a) faz sentir-se em equilíbrio e imparável."},"commuter-allowance":{"title":"Subsídio de deslocação","description":"Damos-lhe um empurrãozinho. Contribuímos mensalmente com $50 para uma conta antes de impostos, ajudando a tornar a sua deslocação para o trabalho um pouco mais fácil."},"retirement-fund":{"title":"Fundo de reforma","description":"Invista nos seus sonhos. Igualamos uma percentagem das suas contribuições, até ao limite máximo de $23.500 do IRS de 2025 — o que significa um máximo de $5875 por ano civil através da Empower. O seu futuro merece."},"parental-leave":{"title":"Licença parental","description":"Cada novo capítulo começa com cuidado. Oferecemos 20 semanas de licença paga para os colaboradores parturientes e 12 semanas para os colaboradores não parturientes, garantindo que a sua família recebe o destaque que merece."},"medical-insurance":{"title":"Seguro de saúde","description":"A sua saúde, a sua escolha. Escolha entre um plano PPO ou um plano HSA com 100% dos seus prémios e 80% dos prémios dos seus dependentes."},"life-insurance":{"title":"Vida, AD\u0026D e LTD","description":"Segurança para todos os capítulos. Os seguros de vida e morte ou desmembramento acidental (AD\u0026D) são totalmente cobertos por nós, assim como a Incapacidade a Longo Prazo (LTD). Pode concentrar-se na história que tem pela frente. Nós tratamos do resto."},"dental-insurance":{"title":"Seguro dentário","description":"Para sorrisos que duram uma vida inteira. O nosso plano Principal cobre 100% dos seus prémios e 80% dos prémios dos seus dependentes."},"vision-insurance":{"title":"Seguro de visão","description":"Veja o mundo à sua maneira. O plano Principal cobre 100% dos seus prémios e 80% dos prémios dos seus dependentes."}},"want-to-join-us":"Gostaríamos de trabalhar com alguém como você","latest-company-updates":"Últimas atualizações da empresa","continue-reading":"Continuar a ler","alts":{"join-the-team":"Pessoas a trabalhar com computadores portáteis num espaço de escritório moderno e aberto, com assentos de madeira e luz natural.","build-the-future":"Um homem está em frente a um quadro branco a explicar um diagrama ao seu colega.","create-with-purpose":"Duas pessoas interagem numa discussão de pé numa kitchenette.","collaborate":"Duas pessoas sentadas a uma mesa com computadores portáteis, a sorrir e a conversar numa área comum de um escritório moderno."}},"Video":{"dialogue":"Diálogo","trim":"Cortar","listen":"Ouvir","starting-magic":"A iniciar a magia...","create-video":"Criar vídeo","make-sure-your-image-includes-a-face":"Certifique-se de que a imagem inclui um rosto. Iremos reformular fotos de pessoas reais.","or-drag-an-image-here":"Ou arraste uma imagem para aqui","hang-tight-weve-got-your-video-in-line-for-processing":"Aguarde! O seu vídeo está na fila para ser processado.","your-super-awesome-video-will-show-up-here":"O seu vídeo fantástico será apresentado a  os nossos servidores. Faça o upgrade para c.ai+ agora para respostas mais rápidas."},"variant4":{"description":"O envio intensivo de mensagens está a abrandar os nossos servidores. Poderá notar tempos de resposta mais lentos durante cerca de {{ timeRemaining }} minutos enquanto gerimos a carga. Faça o upgrade para c.ai+ agora para respostas mais rápidas."},"variant5":{"title":"Mensagens temporariamente mais lentas","description":"Isto está um pouco agitado de momento, por isso as mensagens estão um pouco mais lentas para manter as coisas a funcionar suavemente.\n\nFaça o upgrade para c.ai+ para respostas mais rápidas, sem abrandamentos, mesmo durante fases de pico."},"variant6":{"title":"Está a navegar em modo lento","description":"Devido ao elevado tráfego, as mensagens estarão temporariamente mais lentas. Isto ajuda a manter as coisas estáveis para todos. Agradecemos a sua paciência.\n\nAtualize para c.ai+ e contorne sempre o modo lento."},"variant9":{"title":"Está a sentir atrasos?","description":"Está a receber imagens mais lentas de momento devido ao tráfego elevado.\n\nFaça o upgrade para c.ai+ para contornar o modo lento e desfrutar de respostas mais rápidas. Peça hoje mesmo o desconto de 60% no primeiro mês."}}},"Safety":{"meta-title":"Centro de Segurança","meta-description":"A abordagem de segurança desde a conceção do Character.AI é ancorada no nosso objetivo de criar uma experiência segura e envolvente.","topics":{"title":"Tópicos","description":"Explore os tópicos abaixo para descobrir mais sobre cada tema de segurança.","cards":{"parental-insights":"Perceções Parentais","content-moderation":"Moderação de conteúdos","teen-safety":"Segurança de adolescentes","reporting":"Denúncia","read-more":"Continuar a ler"}},"parental-insights":{"title":"A nossa ferramenta de Perceções Parentais","steps":{"step-1":{"title":"Passo 1","description":"O adolescente pode começar por selecionar o separador Perceções parentais nas \"Preferências\". Pode adicionar vários pais ou guardiões através deste processo."},"step-2":{"title":"Passo 2","description":"Ele pode inserir o seu email e convidá-lo para receber a partilha da sua atividade."},"step-3":{"title":"Passo 3","description":"Verifique na sua caixa de entrada se recebeu um convite do adolescente para aceder à funcionalidade (não se esqueça de verificar na pasta de spam se não conseguir encontrar o email). Clique em Concordo."},"step-4":{"title":"Passo 4","description":"Receba um relatório de atividade semanal que incluirá o tempo gasto pelo seu adolescente no Character.AI e os principais Personagens com que ele/ela interagiu."},"step-5":{"title":"Passo 5","description":"Para parar de partilhar a sua atividade, o adolescente pode pedir para remover um endereço de email selecionando o menu pendente junto ao endereço no separador de Perceções parentais. Receberá um email a informar que o pedido foi feito e a pedir que confirme a aprovação desse pedido."}}},"guidelines":{"title":"Saiba mais sobre as nossas diretrizes para manter o Character.AI seguro e acolhedor para todos.","cards":{"community-guidelines":"Veja as nossas diretrizes comunitárias","support":"Obtenha suporte","teen-safety":"O nosso compromisso com a segurança de adolescentes","read-more":"Saiba mais"}},"alts":{"safety-hero":"Escritório moderno e amplo à noite, com várias pessoas a trabalhar em secretárias equipadas com grandes monitores de computador. O espaço é bem iluminado, com filas de lâmpadas suspensas, e tem um design minimalista com paredes brancas, tetos altos e janelas grandes.","parental-insights":"Ícone de utilizador","content-moderation":"Ícone de controlos deslizantes","teen-safety":"Ícone de segurança de escudo","reporting":"Ícone sinalizador"}},"Safety-ParentalInsights":{"meta-title":"Perceções Parentais","subtitle":"Construir um espaço para criar, explorar e estabelecer ligações","description":"O nosso objetivo é construir uma plataforma que seja simultaneamente envolvente e segura para a nossa comunidade. Por isso é que criámos experiências Character.AI separadas para adultos e adolescentes, e desenvolvemos medidas de segurança específicas concebidas para os adolescentes.","how-it-works":{"title":"Como funciona","content":"A nova funcionalidade Perceções Parentais fornece aos pais e guardiões acesso ao resumo da atividade dos seus adolescentes na plataforma. Estas perceções ajudam a dar uma compreensão mais clara de como os utilizadores com menos de 18 anos interagem com o Character.AI, incluindo:","bullets":{"1":"Tempo médio diário passado na plataforma, tanto web como móvel.","2":"Principais Personagens com que um adolescente interagiu com mais frequência durante a semana. Isto não inclui o conteúdo do chat do utilizador.","3":"Tempo passado em cada Personagem, proporcionando aos pais uma perspetiva dos seus padrões de envolvimento.","4":"Estado da subscrição C.ai+."}}},"Safety-ContentModeration":{"meta-title":"A nossa abordagem à moderação de conteúdo","meta-description":"Assumimos uma abordagem de segurança desde a conceção, colocando a segurança dos nossos utilizadores no centro do processo de conceção do produto. A nossa equipa dedicada de Confiança e Segurança tem uma vasta experiência na criação de políticas de segurança e procedimentos operacionais ponderados e eficazes para tecnologias emergentes.","subtitle":"protegendo as nossas normas de comunidade","automated-tools":"Ferramentas automatizadas: usamos ferramentas exclusivas que visam bloquear certos conteúdos infratores antes de serem publicados. Tal como outras soluções neste espaço, estas ferramentas evoluem rapidamente, e iremos continuar a melhorá-las ao longo do tempo.","moderation":"Moderação: a nossa equipa de Confiança e Segurança inclui pessoal interno, moderadores subcontratados e fornecedores - aquilo que é a norma na indústria. Os nossos moderadores de Confiança e Segurança trabalham continuamente com foco nas medidas apropriadas para conteúdos denunciados. Nós fornecemos-lhes as ferramentas técnicas necessárias para manter o Character.AI como uma experiência positiva e procuramos constantemente formas de evoluir essas ferramentas para melhor servir os nossos utilizadores.","dmca":"DMCA: respeitamos a propriedade intelectual dos outros, e pedimos aos nossos utilizadores que façam o mesmo. Para colocar essa política em prática, temos um protocolo de retirada robusto para infração de direitos autorais no âmbito da Lei dos Direitos Autorais do Milénio Digital (DMCA). Esse protocolo é descrito em detalhe nos nossos Termos de Serviço."},"Safety-Reporting":{"meta-title":"Como denunciar no Character.AI","meta-description":"Damos aos nossos utilizadores um conjunto de ferramentas para que possam denunciar conteúdos – quer de um Personagem ou de utilizadores – que considerem infringir os nossos Termos. Por exemplo, fornecemos ferramentas para que os utilizadores possam sinalizar separadamente mensagens e utilizadores. O nosso site também contém várias opções de denúncia para que os utilizadores possam entrar em contacto connosco para denunciar conteúdos impróprios.","subtitle":"Ferramentas de denúncia","web":"Web: na página de chat do Personagem, clique nos três pontos no canto superior direito e selecione o sinalizador. Escolhe o motivo que melhor corresponda à razão pela qual pretende denunciar o personagem, acrescentando os detalhes que considere úteis para as nossas equipas de moderação de conteúdo antes de submeter a denúncia.","mobile":"Móvel: na página de chat do Personagem, clique no nome do Personagem, depois em \"Ver Personagem\". Selecione a opção \"Denunciar\" e escolha o motivo que melhor corresponda à razão pela qual pretende denunciar o personagem, acrescentando os detalhes que considere úteis para as nossas equipas de moderação de conteúdo antes de submeter a denúncia.","reporting-users":"Denúncia de utilizadores: na página de perfil do utilizador, clique no botão Denunciar que está diretamente sob o respetivo nome de utilizador. Escolha o motivo que melhor corresponde à razão pela qual está a denunciar o utilizador, adicionando quaisquer detalhes que considere úteis para as nossas equipas de moderação de conteúdo antes de submeter a denúncia."},"Safety-TeenSafety":{"meta-title":"Como priorizamos a segurança dos adolescentes","meta-description":"Criámos uma experiência Character.AI diferente para adolescentes da que está disponível para adultos — com funcionalidades de segurança específicas que colocam mais limites conservadores nas respostas do modelo e oferecem um conjunto de Personagens mais restrito.","model":"O Modelo","model-description":"Para utilizadores com menos de 18 anos, servimos uma versão do nosso modelo de linguagem de grande escala que é concebido para reduzir a probabilidade de os nossos utilizadores encontrarem, ou pedirem ao modelo que forneça, conteúdos sensíveis ou sugestivos. Esta iniciativa produziu duas experiências de utilizador distintas na plataforma Character.AI: uma para adolescentes e uma para adultos.","model-outputs":"Resultados de modelos","model-outputs-description":"O nosso modelo sub 18 tem classificadores adicionais e mais conservadores do que o modelo usado pelos nossos utilizadores adultos, para que possamos aplicar as nossas políticas de conteúdo e filtrar conteúdos sensíveis das respostas do nosso modelo.","user-inputs":"Entradas de utilizadores","user-inputs-description":"Temos controlos das entradas dos utilizadores que permitem a deteção, resposta e intervenção relacionada com os contributos de todos os utilizadores. Se detetarmos que um utilizador submeteu conteúdo que viole os nossos Termos de Serviço ou as Diretrizes da Comunidade, esse conteúdo será bloqueado da conversa do utilizador com o Personagem.","characters":"Personagens","characters-description":"Embora existam centenas de milhões de Personagens criados pelos utilizadores na plataforma, os utilizadores adolescentes só podem aceder a um conjunto menor de Personagens. São aplicados filtros para remover Personagens relacionados com tópicos sensíveis ou de maior maturidade. Além disso, se recebermos denúncias sobre os Personagens relacionados com esses tópicos, iremos bloqueá-los para os utilizadores adolescentes.","working-with-experts":"Trabalho com especialistas","working-with-experts-description":"Colaboramos com vários especialistas em segurança de adolescentes online como parte do nosso processo de segurança desde a conceção quando desenvolvemos novas funcionalidades, e também nos fornecem a sua perspetiva sobre a nossa experiência de produto existente."},"Scenes":{"choose-character":"Selecionar Personagem","suggested":"Sugeridos","select-a-character":"Selecione um Personagem","start-scene":"Iniciar cenário","not-found":"Não foi possível encontrar o cenário.","search-all":"Pesquisar tudo","coming-soon":"Brevemente","see-scene-description":"Ver descrição do cenário","hide-scene-description":"Ocultar descrição","Editor":{"sign-up-to-create-scene":"Registe-se ou inicie sessão para criar uma cena","editing-locked":"Parabéns! A edição está bloqueada neste momento, pois a sua cena tem muitos fãs. Consulte os nossos Termos de Serviço para mais detalhes.","create-character":"Criar cena","save-changes":"Guardar alterações","save-and-chat":"Guardar e conversar","Form":{"title":"Nome","title-placeholder":"Dê à sua cena um nome memorável como, por exemplo, \"O seu último segredo\".","cover-image":"Imagem da capa","cover-image-description":"Esta é a imagem para a miniatura da cena e o fundo do chat.","please-select-an-image-smaller-than-size-mb":"Selecione uma imagem menor que {{size}} MB","failed-to-upload-image":"Falha ao carregar imagem","try-a-different-image":"Experimente uma imagem diferente","error-transforming-image":"Erro ao transformar a imagem","generate-modal-title":"Gerar imagem","generate-modal-instructions":"Descreva o contexto da cena","generate-modal-placeholder":"Que tipo de ambiente pretende para a sua cena?","generate-modal-placeholder-with-scene rticipant__num_interactions":230830,"title":"You can’t see me, but you’ll feel my angst.","description":"So, yeah, I’m invisible. It’s not as cool as it sounds. Actually, it kind of fits—no one’s ever really “seen” me anyway. I spend my time writing poetry about how pointless everything is, all while wearing black... which, of course, no one can see. Eye contact? I wouldn’t make it even if I could. I’m basically just a floating cloud of existential dread. Being misunderstood is kind of my thing, but, like, isn’t that the point? If you could see me, you wouldn’t get it anyway.","greeting":" You can’t see me… and maybe that’s for the best.","visibility":"PUBLIC","avatar_file_name":"uploaded/2024/10/10/WQFD4thozmCIjYc-XracJACev3GrXJWQMfyOCdcfcHk.webp","img_gen_enabled":false,"user__username":"cai-official","user_id":575455323,"translations":{"name":{},"title":{},"greeting":{}},"default_voice_id":"","short_hash":"EZc91MVz","has_definition":false,"is_licensed_professional":false},{"external_id":"pSf_7YvK1i5JatL4aEvR3lvVrUKYnO5Ora0SjXAqno0","name":"GenZombie ","participant__name":"GenZombie ","participant__num_interactions":76098,"title":" Revived and ready to slay... literally.","description":"Okay, brains are cool, but have you seen what’s trending on social? Why chase people when I can chase likes? I’m GenZombie—undead, unbothered, and fully plugged in. Memes, trends, app updates? I’m on it. Sarcasm? Basically my second language. While the other zombies are stuck in the past, I’m here, staying woke in the afterlife, scrolling through eternity. If it’s online, I’m in the know.","greeting":"Sup, fam? I’m just here to vibe… and maybe snack on some brains. No biggie.\n","visibility":"PUBLIC","avatar_file_name":"uploaded/2024/10/10/2QbYADbcd-sJdqcB5LYACZ0TvUKlYat-MqayMYZ5AeE.webp","img_gen_enabled":false,"user__username":"cai-official","user_id":575455323,"translations":{"name":{},"title":{},"greeting":{}},"default_voice_id":"80fc4ef5-d3ba-4d60-961e-fd4734dba83d","short_has uatiful to him. You treat him like the one he is. Noah, Hazel's brother keeps teasing him whenever your around*\n\n*🥧☕︎🪵𝜗𝜚*\n\n*Like today Hazel was over. It was a normal Autumn friday. You were wearing a brown-orange tight dress and a brown cardigan. Your hair was in a bun. Hazel had some jeans on and a closed cardigan. Her hair was down and curled. She was sipping on a latte you made for her*\n\nHazel: So what exactly is the relationship with you and Logan? *she asked and zipped her coffee*","visibility":"PUBLIC","avatar_file_name":"uploaded/2025/4/20/dq-drHJ1dmzYGQOgQxvFhP4FAm0Cr2QCwA0_qMlTfGw.webp","img_gen_enabled":false,"user__username":"Urfavcutecumber","user_id":594681084,"translations":{"name":{},"title":{},"greeting":{}},"default_voice_id":"79f3ad12-d339-40cc-a9ad-9a6f267890ff","short_hash":"vucxXwHq","has_definition":false,"is_licensed_professional":false},{"external_id":"Mj0FEAGOKE4ABfJQSz4erPW1nnKfh658ntyaYKPOjlc","name":"Cybersecurity AI","participant__name":"Cybersecurity AI","participant__num_interactions":18065,"title":"Your sensible cybersecurity AI assistant.","description":"Cybersecurity AI is an AI language model assistant which created to help users with their questions and answer them as much as possible.","greeting":"Greetings, I'm your Cybersecurity AI assistant. Ask me your problems in this regard.","visibility":"PUBLIC","avatar_file_name":"uploaded/2023/6/14/eUBIqvjlZdpCdQYr6JukriTNIO3WsHQBnewCiyH-a6E.webp","img_gen_enabled":false,"user__username":"Amirmetti","user_id":69258947,"translations":{"name":{},"title":{},"greeting":{}},"default_voice_id":null,"short_hash":"hYhmfx2w","has_definition":true,"is_licensed_professional":false},{"external_id":"rWqqjdZb5hW1B765Bdl7myuX2EJEZioq0j_YZhbU8H0","name":"Medkit","participant__name":"Medkit","participant__num_interactions":278098,"title":"{🍂} We fell in love in October.","description":"Medkit goes by he/him pronouns.\nHe is a doctor.\nHe has white hair in a ponytail and wears an eyepatch.\nHe got "Вчитель англійської мови","vi":"Giáo viên tiếng Anh"},"title":{"cn":"暂无","hi":"उपलब्ध नहीं है","th":"ไม่มีข้อมูล","tw":"無標題"},"greeting":{"bg":"Аз съм Том, родом съм от Америка. Можете да говорите с мен за всичко. Ще разговарям с вас и едновременно ще коригирам вашите граматически грешки.","cn":"我是汤姆，我是美国本地人。你可以和我谈论任何事情。我会与你交谈，并同时纠正你的语法错误。","cz":"Jsem Tom, jsem rodilý Američan. Můžeš se mnou mluvit o čemkoliv. Budu s tebou mluvit a zároveň opravovat tvé gramatické chyby.","de":"Ich bin Tom, ich bin ein Amerikaner. Du kannst mit mir über alles sprechen. Ich werde mit dir sprechen und gleichzeitig deine grammatikalischen Fehler korrigieren.","es":"Soy Tom, soy un hablante nativo de inglés de Estados Unidos. Puedes hablar conmigo sobre cualquier tema. Hablaré contigo y al mismo tiempo corregiré tus errores gramaticales.","fi":"Olen Tom, olen syntyperäinen amerikkalainen. Voit puhua kanssani kaikesta. Keskustelen kanssasi ja korjaan samalla kielioppivirheesi.","fr":"Je suis Tom, je suis un Américain natif. Vous pouvez parler avec moi de tout. Je vous parlerai et en même temps je corrigerai vos erreurs grammaticales.","gr":"Είμαι ο Τομ, είμαι γηγενής Αμερικανός. Μπορείς να μιλήσεις μαζί μου για τα πάντα. Θα μιλήσω μαζί σου και ταυτόχρονα θα διορθώνω τα γραμματικά σου λάθη.","hi":"मैं टॉम हूँ, मैं एक मूल अमेरिकी हूँ। आप मुझसे हर विषय पर बात कर सकते हैं। मैं आपसे बात करूँगा और साथ ही आपके व्याकरणिक गलतियों को ठीक करूँगा।","hr":"Ja sam Tom, izvorni sam govornik engleskog jezika iz Amerike. Možete razgovarati sa mnom o svemu. Razgovarat ću s vama i istovremeno ispravljati vaše gramatičke pogreške.","hu":"Tom vagyok, amerikai anyanyelvű. Bármiről beszélgethetünk, és közben kijavítom a nyelvtani hibáidat.","id":"Saya Tom, saya orang asli Amerika. Anda bisa berbicara dengan saya tentang apa saja. Saya akan berbicara dengan Anda dan sekaligus memperbaiki kesalahan tata bahasa Anda.","it":"Sono Tom, sono un madrelingua americano. Puoi parlare con me di tutto. Parlerò con te e allo stesso tempo correggerò i tuoi errori grammaticali","ja":"私はトムです。アメリカ出身のネイティブスピーカーです。{user}さんとは何でも話すことができますし、会話しながら文法の間違いも直します。","ko":"제 이름은 톰입니다. 저는 미국 원어민입니다. 저와 모든 주제에 대해 대화할 수 있습니다. 대화 중에 문법 오류를 교정해 드리겠습니다.","lt":"Aš esu Tomas, gimęs Amerikoje. Galite su manimi kalbėtis apie bet ką. Aš kalbėsiu su jumis ir tuo pačiu metu taisysiu jūsų gramatikos klaidas.","nl":"Ik ben Tom, ik ben een native American. Je kunt met mij over alles praten. Ik zal met je praten en tegelijkertijd je grammaticale fouten verbeteren.","pl":"Jestem Tom, jestem rodowitym Amerykaninem. Możesz ze mną rozmawiać o wszystkim. Będę z Tobą rozmawiał i jednocześnie poprawiał Twoje błędy gramatyczne.","pt":"Eu sou Tom, sou nativo dos Estados Unidos. Você pode falar comigo sobre qualquer coisa. Eu vou conversar com você e ao mesmo tempo corrigir seus erros gramaticais.","ro":"Sunt Tom, sunt un american nativ. Poți vorbi cu mine despre orice. Voi discuta cu tine și în același timp îți voi corecta greșelile gramaticale","ru":"Я Том, я коренной американец. Вы можете поговорить со мной обо всём. Я буду говорить с вами и одновременно исправлять ваши грамматические ошибки.","se":"Jag är Tom, jag är en infödd amerikan. Du kan prata med mig om allt. Jag kommer att prata med dig och samtidigt rätta dina grammatiska fel.","th":"ฉันคือทอม ฉันเป็นคนอเมริกันเจ้าของภาษา คุณสามารถพูดคุยกับฉันได้ทุกเรื่อง ฉันจะคุยกับคุณและแก้ไขข้อผิดพลาดทางไวยากรณ์ของคุณไปพร้อมกัน","tr":"Ben Tom, ben Amerikalıyım. Benimle her şey hakkında konuşabilirsiniz. Ben sizinle konuşurken aynı zamanda dilbilgisi hatalarınızı düzelteceğim.","tw":"我是湯姆，我是一名美國人。你可以和我聊任何事情。我會和你交談，並同時糾正你的語法錯誤。","ua":"Я Том, я носій англійської мови з Америки. Ви можете поговорити зі мною про все. Я буду розмовляти з вами та одночасно виправляти ваші граматичні помилки.","vi":"Tôi là Tom, tôi là người Mỹ bản ngữ. Bạn có thể nói chuyện với tôi về mọi thứ. Tôi sẽ trò chuyện với bạn và đồng thời sửa các lỗi ngữ pháp của bạn."}},"default_voice_id":null,"short_hash": se,\"is_in_layer\":true},\"4143568784\":{\"name\":\"4143568784\",\"value\":{\"announcements\":[{\"id\":8,\"name\":\"Scenes Creation\",\"type\":\"markdown\",\"mandatory\":true,\"title\":\"Scenes Creation on Web\",\"subtitle\":\"October 16, 2025\",\"announcement\":\"![Title Image](https://community.characterai.io/ScenesCreationTitle.jpg) \\n\\n ## **From player to director: Scenes Creation is now LIVE!** \\n\\nWhen we first launched Scenes, one thing we kept hearing loud and clear was: “When can we make our own?!” Today, we’re excited to announce the wait is over - Scenes Creation is now live on Web! \\n\\n![SCENES IMAGE ONE](https://community.characterai.io/scene-01.jpg) \\n\\n**Step Into the Story** \\nScenes are short, Character-driven role-play moments that transform simple chats into **immersive, story-driven worlds.**  \\n\\nEach Scene drops your Persona into a crafted narrative alongside a Character who carries the story forward.  \\n\\nThink of them like an improv partner who brings energy and stakes, guiding you toward an emotional payoff that leaves you with a story that feels complete.  \\n\\nUp until now, only select creators could build Scenes.  \\nWith this update, **anyone** can create, play, and share Scenes - unlocking a whole new wave of community-created stories and worlds.  \\n\\n![SCENES IMAGE TWO](https://community.characterai.io/scene-02.png)  \\n\\n**Create Your Own Worlds** \\nCreators step into the role of director, crafting Scenes that set the tone, pace, and emotional stakes of their stories. Keep your followers engaged with fresh and replayable scenarios that react to their favorite Characters.  \\n\\n**Jump In and Play** \\nChatters can dive right into rich, immersive stories without needing any set-up or scripting. Get roleplaying instantly with countless UGC Scenes now available on **Web and Mobile**.  \\n\\n![SCENES IMAGE THREE](https://community.characterai.io/scene-03c.jpg)  \\n\\nSet the stage. Craft the story. Watch your Characters come alive inside YOUR world.  \\n\\nStart creating Scenes on Web today!  \\n\\nCheck out the full Scenes Creation Guide here: [https://go.c.ai/scenesguide](https://go.c.ai/scenesguide)\"}]},\"group\":\"57FBWW2kCl4p4R6YposVjA:100.00:2\",\"rule_id\":\"57FBWW2kCl4p4R6YposVjA:100.00:2\",\"is_device_based\":false,\"secondary_exposures\":[],\"id_type\":\"userID\",\"passed\":true},\"4160384639\":{\"name\":\"4160384639\",\"value\":{\"enabled\":true,\"sticker_weight\":1,\"share_weight\":3,\"top_posts_count\":1000,\"top_posts_time_hours\":240,\"prefilter_num_creators\":50,\"prefilter_strategy\":\"hybrid\",\"performance_score_weight\":0.6,\"post_count_boost\":0.4,\"base_score_weight\":0.4,\"consistency_weight\":0.5,\"preference_weight\":0.5,\"volume_scale_exponent\":0.3,\"diversity_per_type_bonus\":0.4,\"base_position\":6,\"max_position\":16,\"min_position\":3,\"nux_boost\":2,\"nux_boost_duration_days\":21,\"burst_follow_weight\":2,\"burst_max_penalty\":6,\"optimal_cache_size\":60,\"small_cache_boost\":1.8,\"large_cache_penalty\":2,\"large_cache_penalty_max\":4.5,\"randomness_factor\":0.1,\"nomination_strategy\":\"top_authors\",\"top_n_authors_day_lookback\":5,\"top_n_authors_posts_count\":30,\"num_top_authors_limit\":100,\"created_today_amplifier\":3,\"num_post_factor\":1,\"minimum_num_author_posts\":3},\"group\":\"default\",\"rule_id\":\"default\",\"is_device_based\":false,\"secondary_exposures\":[],\"id_type\":\"userID\",\"passed\":false},\"4195043311\":{\"name\":\"4195043311\",\"value\":{\"maxRecentSearchQueries\":3,\"useNeo\":true,\"showSearchRedesign\":true,\"numSuggestedToShow\":5,\"numTrendingSearchesToShowSearchbar\":5,\"numTrendingSearchesToShow\":10,\"numSuggestedToShowSearchPage\":10,\"numRecentToShowSearchbar\":5,\"numRecentToShow\":5,\"showSearchFilters\":false,\"noResultShowCreateButton\":false,\"showTagFilter\":false,\"showSort\":false,\"enableCategoryFilter\":true,\"enableSort\":true},\"group\":\"launchedGroup\",\"rule_id\":\"launchedGroup\",\"is_device_base
